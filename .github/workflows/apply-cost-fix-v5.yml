name: Verify and commit cost fix v5

on:
  push:
    branches:
      - fix/cost-auto-mapping-calculation
    paths:
      - .github/workflows/apply-cost-fix-v5.yml

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/cost-fix-script/part*.b64 | base64 --decode > /tmp/apply_cost_fix.py
          python /tmp/apply_cost_fix.py
          git diff --check

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run targeted regression tests
        shell: bash
        run: |
          set -euo pipefail
          export TS_NODE_COMPILER_OPTIONS='{"module":"CommonJS","moduleResolution":"node"}'
          node -r ts-node/register --test lib/cost-structure/mappings/company-7000-derived-cc-prod.test.ts
          node -r ts-node/register --test lib/cost-structure/mappings/family-mapping-policy.test.ts
          node -r ts-node/register --test --test-name-pattern='skips a repeated SAP header|prefers authoritative Cost Elements' lib/cost-structure/parsers/workbook.test.ts

      - name: Lint changed files only
        run: >-
          npx eslint
          lib/cost-structure/mappings/company-7000-derived-cc-prod.ts
          lib/cost-structure/mappings/company-7000-derived-cc-prod.test.ts
          lib/cost-structure/mappings/family-mapping-backfill.ts
          lib/cost-structure/parsers/workbook.ts
          lib/cost-structure/parsers/workbook.test.ts
          app/api/cost-structure/uploads/[id]/mapping/route.ts

      - name: Run production build
        run: npm run build

      - name: Commit verified source changes only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp
          rm -f package-lock.json
          git checkout -- package.json || true
          git rm -f .github/workflows/apply-cost-fix.yml .github/workflows/apply-cost-fix-v2.yml .github/workflows/apply-cost-fix-v3.yml .github/workflows/apply-cost-fix-v4.yml .github/workflows/apply-cost-fix-v5.yml || true
          git add -A
          git diff --cached --check
          echo 'Final staged files:'
          git diff --cached --name-status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(cost): repair auto mapping and parser readiness"
          git push origin HEAD:fix/cost-auto-mapping-calculation
