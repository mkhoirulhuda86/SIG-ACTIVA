name: Verify persisted reconciliation transition

on:
  push:
    branches:
      - fix/persisted-reconciliation-transition

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source patch
        shell: bash
        run: |
          set -euo pipefail
          python .tmp/persisted-reconciliation-transition/apply.py
          git diff --check
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          npx eslint lib/cost-structure/processing/service.ts
          export TS_NODE_TRANSPILE_ONLY=true
          export TS_NODE_COMPILER_OPTIONS='{"module":"CommonJS","moduleResolution":"node"}'
          node -r ts-node/register --test lib/cost-structure/processing/state-machine.test.ts
      - name: Commit verified source change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/cost-structure/processing/service.ts
          git commit -m 'fix(cost): persist reconciliation before calculation'
          git push origin HEAD:fix/persisted-reconciliation-transition
