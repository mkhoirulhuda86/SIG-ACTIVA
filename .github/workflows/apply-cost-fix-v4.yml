name: Verify and commit cost fix v4

on:
  push:
    branches:
      - fix/cost-auto-mapping-calculation
    paths:
      - .github/workflows/apply-cost-fix-v4.yml

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/cost-fix-script/part*.b64 | base64 --decode > /tmp/apply_cost_fix.py
          python /tmp/apply_cost_fix.py
          git diff --check

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run targeted mapping regression tests
        shell: bash
        run: |
          set -euo pipefail
          export TS_NODE_COMPILER_OPTIONS='{"module":"CommonJS","moduleResolution":"node"}'
          node -r ts-node/register --test lib/cost-structure/mappings/company-7000-derived-cc-prod.test.ts
          node -r ts-node/register --test lib/cost-structure/mappings/family-mapping-policy.test.ts

      - name: Run targeted parser regression tests
        shell: bash
        run: |
          set -euo pipefail
          export TS_NODE_COMPILER_OPTIONS='{"module":"CommonJS","moduleResolution":"node"}'
          node -r ts-node/register --test --test-name-pattern='skips a repeated SAP header|prefers authoritative Cost Elements' lib/cost-structure/parsers/workbook.test.ts

      - name: Confirm full-suite failure count does not exceed baseline
        shell: bash
        run: |
          set +e
          npm test > /tmp/full-test.log 2>&1
          status=$?
          set -e
          tail -80 /tmp/full-test.log
          fail_count=$(grep -E '^# fail [0-9]+$' /tmp/full-test.log | tail -1 | awk '{print $3}')
          test_count=$(grep -E '^# tests [0-9]+$' /tmp/full-test.log | tail -1 | awk '{print $3}')
          echo "Observed full suite: tests=${test_count:-unknown}, fail=${fail_count:-unknown}, exit=${status}"
          test "${test_count:-0}" -ge 254
          test "${fail_count:-999}" -le 12

      - name: Run lint
        run: npm run lint

      - name: Run production build
        run: npm run build

      - name: Commit verified source changes only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp
          rm -f package-lock.json
          git checkout -- package.json || true
          git rm -f .github/workflows/apply-cost-fix.yml .github/workflows/apply-cost-fix-v2.yml .github/workflows/apply-cost-fix-v3.yml .github/workflows/apply-cost-fix-v4.yml || true
          git add -A
          git diff --cached --check
          echo 'Final staged files:'
          git diff --cached --name-status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(cost): repair auto mapping and parser readiness"
          git push origin HEAD:fix/cost-auto-mapping-calculation
