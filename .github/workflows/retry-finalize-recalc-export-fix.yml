name: Retry finalized recalculate export fix

on:
  push:
    branches:
      - fix/recalculate-export-traceability

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply corrected embedded patch
        shell: bash
        run: |
          python <<'RUNNER'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/finalize-recalc-export-fix.yml').read_text()
          workflow = workflow.replace("lib/cost-structure/parsers/index.ts", "lib/cost-structure/parsers/workbook.ts")
          marker = "python <<'PY'\n"
          script = workflow.split(marker, 1)[1].split("\n          PY", 1)[0]
          exec(compile(textwrap.dedent(script), '<corrected-patch>', 'exec'), {})
          Path('.github/workflows/retry-finalize-recalc-export-fix.yml').unlink()
          RUNNER
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Cost structure tests
        run: npm test
      - name: Lint changed production files
        run: npx eslint components/cost-structure/process/presentation.ts components/cost-structure/process/process-workflow.tsx components/cost-structure/process/types.ts lib/cost-structure/calculations/company-7000.ts lib/cost-structure/calculations/rule-set.ts lib/cost-structure/calculations/run-service.ts lib/cost-structure/processing/automatic-calculation.ts lib/cost-structure/processing/service.ts lib/cost-structure/processing/state-machine.ts lib/cost-structure/parsers/workbook.ts lib/cost-structure/parsers/types.ts lib/cost-structure/export/service.ts lib/cost-structure/finalization/policy.ts lib/cost-structure/finalization/service.ts lib/cost-structure/recalculate-export-traceability.test.ts
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Commit tested fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(cost): recalculate stale runs and export full source lineage"
          git push origin HEAD:fix/recalculate-export-traceability
