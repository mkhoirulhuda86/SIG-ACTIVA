name: Apply and verify cost fix

on:
  push:
    branches:
      - fix/cost-auto-mapping-calculation
    paths:
      - .github/workflows/apply-cost-fix.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/cost-fix-script/part*.b64 | base64 --decode > /tmp/apply_cost_fix.py
          python /tmp/apply_cost_fix.py
          git diff --check

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run cost-structure tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Run production build
        run: npm run build

      - name: Commit verified code only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp
          git rm .github/workflows/apply-cost-fix.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(cost): repair auto mapping and calculation readiness"
          git push origin HEAD:fix/cost-auto-mapping-calculation
