name: Finalize recalculate and export traceability fix

on:
  push:
    branches:
      - fix/recalculate-export-traceability

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply remaining patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_text(text)

          def replace(path, old, new, count=None):
              text = read(path)
              found = text.count(old)
              if found == 0:
                  raise SystemExit(f'pattern missing in {path}: {old[:100]!r}')
              if count is not None and found != count:
                  raise SystemExit(f'pattern count mismatch in {path}: found {found}, expected {count}')
              write(path, text.replace(old, new))

          # Company 7000 calculation logic changed materially (authoritative OA Rincian rule).
          replace(
              'lib/cost-structure/calculations/company-7000.ts',
              "export const ENGINE1_7000_RULE_SET_VERSION = 'ENGINE1_7000_V1';",
              "export const ENGINE1_7000_RULE_SET_VERSION = 'ENGINE1_7000_V2';",
              1,
          )

          # A stale/reopened period may be explicitly recalculated from the reconciled state.
          replace(
              'lib/cost-structure/calculations/run-service.ts',
              "if (!['SOURCE_RECONCILED', 'CALCULATED'].includes(period.status)) throw new Error('Periode belum SOURCE_RECONCILED.');",
              "if (!['SOURCE_RECONCILED', 'CALCULATED', 'COST_STRUCTURE_RECONCILED'].includes(period.status)) throw new Error('Periode belum eligible untuk calculation/recalculation.');",
              2,
          )

          # Persist every otherwise-unmatched workbook worksheet as an audit/reference snapshot.
          path = 'lib/cost-structure/parsers/types.ts'
          text = read(path)
          old = "  | 'AUDIT_SI2000_DRV';"
          if old not in text: raise SystemExit('types audit union marker missing')
          text = text.replace(old, "  | 'AUDIT_SI2000_DRV'\n  | 'AUDIT_REFERENCE';", 1)
          write(path, text)

          path = 'lib/cost-structure/parsers/index.ts'
          text = read(path)
          old = """  for (const sheetName of workbook.SheetNames) {
            if (normalizeLabel(sheetName) === 'META') continue;
            const definition = detectSource(sheetName, companyCode);
            if (!definition) continue;
            const sheet = { name: sheetName, rows: sheetMatrix(workbook, sheetName) };
            matched.set(definition.code, [...(matched.get(definition.code) || []), sheet]);
          }
          """.replace('          ', '')
          new = """  for (const sheetName of workbook.SheetNames) {
            if (normalizeLabel(sheetName) === 'META') continue;
            const sheet = { name: sheetName, rows: sheetMatrix(workbook, sheetName) };
            const definition = detectSource(sheetName, companyCode);
            if (!definition) {
              if (!hasMeaningfulRows(sheet.rows)) continue;
              const referenceRows = preserveRawRows(sheet, 'AUDIT_REFERENCE');
              rows.push(...referenceRows);
              sources.push({ code: 'AUDIT_REFERENCE', sheetName: sheet.name, rowCount: referenceRows.length });
              continue;
            }
            matched.set(definition.code, [...(matched.get(definition.code) || []), sheet]);
          }
          """.replace('          ', '')
          if old not in text: raise SystemExit('parser workbook sheet loop marker missing')
          text = text.replace(old, new, 1)
          write(path, text)

          # Normalized CC/TB sheets must always expose canonical source row/COA/description/amount,
          # even when helper columns were persisted as COLUMN_n placeholders.
          path = 'lib/cost-structure/export/service.ts'
          text = read(path)
          old = """  const columnKeys = rawKeys.filter((key) => columnIndex(key) !== null);
            if (columnKeys.length) {
              writeRawMatrix(sheet, rows);
              return;
            }
          """.replace('          ', '')
          if old not in text: raise SystemExit('export normalized raw fallback marker missing')
          text = text.replace(old, '', 1)

          marker = """function addSourceSheet(workbook: ExcelJS.Workbook, name: string, rows: SourceRow[], required = false) {
            if (!rows.length) { if (required) throw new Error(`Persisted audit source ${name} tidak tersedia.`); return; }
            const sheet = workbook.addWorksheet(name);
            if (rows.every((row) => AUDIT_TEMPLATE_CODES.has(row.logicalSourceCode))) writeRawMatrix(sheet, rows); else writeNormalizedSource(sheet, rows);
          }
          """.replace('          ', '')
          addition = marker + """

          function uniqueReferenceSheetName(workbook: ExcelJS.Workbook, originalName: string) {
            const clean = (originalName.trim() || 'reference').slice(0, 31);
            if (!workbook.getWorksheet(clean)) return clean;
            for (let index = 1; index < 1000; index += 1) {
              const suffix = `_${index}`;
              const candidate = `ref_${clean}`.slice(0, 31 - suffix.length) + suffix;
              if (!workbook.getWorksheet(candidate)) return candidate;
            }
            throw new Error(`Nama worksheet referensi tidak dapat dibuat unik: ${originalName}`);
          }

          function addPersistedReferenceSheets(workbook: ExcelJS.Workbook, rows: SourceRow[]) {
            const grouped = new Map<string, SourceRow[]>();
            for (const row of rows) grouped.set(row.originalSheetName, [...(grouped.get(row.originalSheetName) ?? []), row]);
            for (const [originalName, sourceRows] of grouped) {
              const sheet = workbook.addWorksheet(uniqueReferenceSheetName(workbook, originalName));
              writeRawMatrix(sheet, sourceRows);
            }
          }
          """.replace('          ', '')
          if marker not in text: raise SystemExit('addSourceSheet marker missing')
          text = text.replace(marker, addition, 1)

          old = """  } else {
            writeCompany2000Si(workbook, run);
            const rincian = workbook.addWorksheet('rincian biaya'); writeRawMatrix(rincian, requireAuditRows(allRows, 'AUDIT_RINCIAN', 'rincian biaya'));
            addSourceSheet(workbook, 'cc prod', rowsByCode(allRows, 'CC_PROD'));
          """.replace('          ', '')
          new = """  } else {
            writeCompany2000Si(workbook, run);
            const rincian = workbook.addWorksheet('rincian biaya'); writeRawMatrix(rincian, requireAuditRows(allRows, 'AUDIT_RINCIAN', 'rincian biaya'));
            addSourceSheet(workbook, 'tb', rowsByCode(allRows, 'TB'), true);
            addSourceSheet(workbook, 'cc prod', rowsByCode(allRows, 'CC_PROD'));
          """.replace('          ', '')
          if old not in text: raise SystemExit('Company 2000 export branch marker missing')
          text = text.replace(old, new, 1)

          old = """  }
            writeFormulaAudit(workbook, run);
          """.replace('          ', '')
          new = """  }
            addPersistedReferenceSheets(workbook, rowsByCode(allRows, 'AUDIT_REFERENCE'));
            writeFormulaAudit(workbook, run);
          """.replace('          ', '')
          if old not in text: raise SystemExit('reference sheet insertion marker missing')
          text = text.replace(old, new, 1)
          write(path, text)

          # Finalization/reconciliation cannot consume a stale run even through direct API calls.
          path = 'lib/cost-structure/finalization/policy.ts'
          text = read(path)
          old = "  run: null | { id: number; status: string; isActive: boolean; uploadIsActiveVersion: boolean };"
          if old not in text: raise SystemExit('finalization policy run type marker missing')
          text = text.replace(old, "  run: null | { id: number; status: string; isActive: boolean; uploadIsActiveVersion: boolean; requiresRecalculation?: boolean };", 1)
          old = "  if (!snapshot.run.uploadIsActiveVersion) throw new FinalizationError('Active calculation run masih terikat ke upload versi lama. Proses upload aktif harus dihitung terlebih dahulu.');"
          if old not in text: raise SystemExit('finalization policy upload guard marker missing')
          text = text.replace(old, old + "\n  if (snapshot.run.requiresRecalculation) throw new FinalizationError('Active calculation run stale; jalankan Recalculate sebelum reconciliation/finalization.');", 1)
          write(path, text)

          path = 'lib/cost-structure/finalization/service.ts'
          text = read(path)
          text = text.replace(
              "import { prisma } from '@/lib/prisma';\n",
              "import { prisma } from '@/lib/prisma';\nimport { getCurrentEngine1RuleSetVersion } from '@/lib/cost-structure/calculations/rule-set';\n",
              1,
          )
          old = "activeCalculationRun: { select: { id: true, status: true, isActive: true, uploadId: true, upload: { select: { isActiveVersion: true } } } },"
          new = "activeCalculationRun: { select: { id: true, status: true, isActive: true, uploadId: true, ruleSetVersion: true, completedAt: true, upload: { select: { isActiveVersion: true } } } },"
          if old not in text: raise SystemExit('finalization service active run select marker missing')
          text = text.replace(old, new, 1)
          old = """  return {
            companyCode: period.company.companyCode,
          """.replace('          ', '')
          new = """  const currentRuleSetVersion = getCurrentEngine1RuleSetVersion(period.company.companyCode);
            const runRequiresRecalculation = Boolean(period.activeCalculationRun && (
              period.activeCalculationRun.ruleSetVersion !== currentRuleSetVersion ||
              (period.reopenedAt && (!period.activeCalculationRun.completedAt || period.activeCalculationRun.completedAt < period.reopenedAt))
            ));
            return {
              companyCode: period.company.companyCode,
          """.replace('          ', '')
          if old not in text: raise SystemExit('finalization service return marker missing')
          text = text.replace(old, new, 1)
          old = """      uploadIsActiveVersion: period.activeCalculationRun.upload.isActiveVersion,
            } : null,
          """.replace('          ', '')
          new = """      uploadIsActiveVersion: period.activeCalculationRun.upload.isActiveVersion,
              requiresRecalculation: runRequiresRecalculation,
            } : null,
          """.replace('          ', '')
          if old not in text: raise SystemExit('finalization run projection marker missing')
          text = text.replace(old, new, 1)
          write(path, text)

          # Keep audit/reference refresh admin-only in UI, while Recalculate remains available
          # to the normal prepare permission through the process endpoint.
          path = 'components/cost-structure/process/process-workflow.tsx'
          text = read(path)
          if "getCurrentUserRole, isAdmin" not in text:
              text = text.replace(
                  "import { useCallback, useEffect, useRef, useState } from 'react';\n",
                  "import { useCallback, useEffect, useRef, useState } from 'react';\nimport { getCurrentUserRole, isAdmin } from '@/app/utils/rolePermissions';\n",
                  1,
              )
          if "const [admin, setAdmin]" not in text:
              text = text.replace("  const [submitting, setSubmitting] = useState(false);\n", "  const [submitting, setSubmitting] = useState(false);\n  const [admin, setAdmin] = useState(false);\n", 1)
          effect_marker = """  useEffect(() => {
            if (!process || requestInFlight.current) return;
          """.replace('          ', '')
          role_effect = """  useEffect(() => {
            const role = getCurrentUserRole();
            // eslint-disable-next-line react-hooks/set-state-in-effect
            setAdmin(role !== null && isAdmin(role));
          }, []);
          """.replace('          ', '')
          if role_effect not in text:
              if effect_marker not in text: raise SystemExit('process workflow effect marker missing')
              text = text.replace(effect_marker, role_effect + effect_marker, 1)
          text = text.replace("  const auditNeedsPreparation = auditStage?.status === 'NOT_APPLICABLE';", "  const auditNeedsPreparation = admin;", 1)
          text = text.replace("Audit/reference historical untuk export belum lengkap", "Referensi workbook untuk export", 1)
          text = text.replace("Snapshot referensi dapat di-refresh dari workbook authoritative tanpa mengubah Engine 1 atau calculation run.", "Refresh membaca ulang worksheet audit/referensi dari workbook authoritative tanpa mengubah Engine 1 atau calculation run.", 1)
          write(path, text)

          # Regression test: pure state + structural contracts for the new traceability rules.
          write('lib/cost-structure/recalculate-export-traceability.test.ts', """import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import test from 'node:test';
          import { deriveProcessStatus, type ProcessingSnapshot } from './processing/state-machine';

          const base = (overrides: Partial<ProcessingSnapshot> = {}): ProcessingSnapshot => ({
            uploadId: 15,
            periodId: 15,
            uploadActive: true,
            uploadStatus: 'VALIDATED',
            periodStatus: 'COST_STRUCTURE_RECONCILED',
            validationBlockers: [],
            reconciliationReady: true,
            reconciliationBlockers: [],
            auditReady: true,
            auditMissing: [],
            calculation: { status: 'SUCCESS', belongsToUpload: true },
            postCheckBlockers: [],
            ...overrides,
          });

          test('stale successful run becomes explicit recalculation stage and cannot finalize', () => {
            const status = deriveProcessStatus(base({ calculation: {
              status: 'SUCCESS', belongsToUpload: true, requiresRecalculation: true,
              runRuleSetVersion: 'ENGINE1_7000_V1', currentRuleSetVersion: 'ENGINE1_7000_V2',
            } }));
            assert.equal(status.currentStage, 'CALCULATION');
            assert.equal(status.requiresRecalculation, true);
            assert.equal(status.canAdvance, true);
            assert.equal(status.readyForFinalization, false);
            assert.match(status.stages.find((stage) => stage.key === 'CALCULATION')?.message ?? '', /ENGINE1_7000_V2/);
          });

          test('fresh successful run remains ready after post-check', () => {
            const status = deriveProcessStatus(base());
            assert.equal(status.overallStatus, 'READY');
            assert.equal(status.requiresRecalculation, false);
            assert.equal(status.readyForFinalization, true);
          });

          test('recalculate and full workbook reference traceability contracts are wired', () => {
            const company7000 = readFileSync('lib/cost-structure/calculations/company-7000.ts', 'utf8');
            const runService = readFileSync('lib/cost-structure/calculations/run-service.ts', 'utf8');
            const parser = readFileSync('lib/cost-structure/parsers/index.ts', 'utf8');
            const parserTypes = readFileSync('lib/cost-structure/parsers/types.ts', 'utf8');
            const exporter = readFileSync('lib/cost-structure/export/service.ts', 'utf8');
            const finalization = readFileSync('lib/cost-structure/finalization/policy.ts', 'utf8');

            assert.match(company7000, /ENGINE1_7000_V2/);
            assert.equal((runService.match(/COST_STRUCTURE_RECONCILED/g) ?? []).length >= 2, true);
            assert.match(parserTypes, /AUDIT_REFERENCE/);
            assert.match(parser, /preserveRawRows\(sheet, 'AUDIT_REFERENCE'\)/);
            assert.match(exporter, /addSourceSheet\(workbook, 'tb', rowsByCode\(allRows, 'TB'\), true\)/);
            assert.match(exporter, /addPersistedReferenceSheets/);
            assert.doesNotMatch(exporter, /if \(columnKeys\.length\)/);
            assert.match(finalization, /requiresRecalculation/);
          });
          """.replace('          ', ''))

          Path('.github/workflows/finalize-recalc-export-fix.yml').unlink()
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Cost structure tests
        run: npm test
      - name: Lint changed production files
        run: npx eslint components/cost-structure/process/presentation.ts components/cost-structure/process/process-workflow.tsx components/cost-structure/process/types.ts lib/cost-structure/calculations/company-7000.ts lib/cost-structure/calculations/rule-set.ts lib/cost-structure/calculations/run-service.ts lib/cost-structure/processing/automatic-calculation.ts lib/cost-structure/processing/service.ts lib/cost-structure/processing/state-machine.ts lib/cost-structure/parsers/index.ts lib/cost-structure/parsers/types.ts lib/cost-structure/export/service.ts lib/cost-structure/finalization/policy.ts lib/cost-structure/finalization/service.ts lib/cost-structure/recalculate-export-traceability.test.ts
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Commit tested fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(cost): recalculate stale runs and export full source lineage"
          git push origin HEAD:fix/recalculate-export-traceability
