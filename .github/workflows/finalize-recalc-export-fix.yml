name: Finalize recalculate and export traceability fix

on:
  push:
    branches:
      - fix/recalculate-export-traceability

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply remaining patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def read(path): return Path(path).read_text()
          def write(path, text):
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_text(text)
          def once(path, old, new):
              text = read(path)
              if old not in text: raise SystemExit(f'missing pattern in {path}: {old[:100]!r}')
              write(path, text.replace(old, new, 1))

          # Rule-set version: OA rule changed materially.
          once('lib/cost-structure/calculations/company-7000.ts',
               "export const ENGINE1_7000_RULE_SET_VERSION = 'ENGINE1_7000_V1';",
               "export const ENGINE1_7000_RULE_SET_VERSION = 'ENGINE1_7000_V2';")

          # Recalculation can safely start from a post-check reconciled state; a successful new run
          # always returns the period to CALCULATED before a new post-check.
          path = 'lib/cost-structure/calculations/run-service.ts'
          text = read(path)
          old = "if (!['SOURCE_RECONCILED', 'CALCULATED'].includes(period.status)) throw new Error('Periode belum SOURCE_RECONCILED.');"
          if text.count(old) != 2: raise SystemExit(f'run-service eligibility count={text.count(old)}')
          text = text.replace(old, "if (!['SOURCE_RECONCILED', 'CALCULATED', 'COST_STRUCTURE_RECONCILED'].includes(period.status)) throw new Error('Periode belum eligible untuk calculation/recalculation.');")
          write(path, text)

          # Persist every non-empty worksheet that is not a known Engine-1 source as audit-only
          # reference data, so exports retain complete workbook traceability.
          once('lib/cost-structure/parsers/types.ts',
               "  | 'AUDIT_SI2000_DRV';",
               "  | 'AUDIT_SI2000_DRV'\n  | 'AUDIT_REFERENCE';")
          path = 'lib/cost-structure/parsers/index.ts'
          text = read(path)
          start = text.index("  for (const sheetName of workbook.SheetNames) {")
          end_marker = "\n\n  for (const definition of sourceDefinitions(companyCode))"
          end = text.index(end_marker, start)
          loop = """  for (const sheetName of workbook.SheetNames) {
            if (normalizeLabel(sheetName) === 'META') continue;
            const sheet = { name: sheetName, rows: sheetMatrix(workbook, sheetName) };
            const definition = detectSource(sheetName, companyCode);
            if (!definition) {
              if (!hasMeaningfulRows(sheet.rows)) continue;
              const referenceRows = preserveRawRows(sheet, 'AUDIT_REFERENCE');
              rows.push(...referenceRows);
              sources.push({ code: 'AUDIT_REFERENCE', sheetName: sheet.name, rowCount: referenceRows.length });
              continue;
            }
            matched.set(definition.code, [...(matched.get(definition.code) || []), sheet]);
          }"""
          loop = '\n'.join(line[10:] if line.startswith('          ') else line for line in loop.splitlines())
          text = text[:start] + loop + text[end:]
          write(path, text)

          # Export CC/TB rows as explicit canonical traceability columns even if helper COLUMN_n
          # placeholders coexist in rawDataJson. Audit/reference sheets still preserve raw layout.
          path = 'lib/cost-structure/export/service.ts'
          text = read(path)
          block = """  const columnKeys = rawKeys.filter((key) => columnIndex(key) !== null);
            if (columnKeys.length) {
              writeRawMatrix(sheet, rows);
              return;
            }
          """
          block = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines()) + '\n'
          if block not in text: raise SystemExit('normalized source fallback block missing')
          text = text.replace(block, '', 1)

          insert_at = text.index("\n\nexport async function buildCostStructureExport")
          helpers = """

          function uniqueReferenceSheetName(workbook: ExcelJS.Workbook, originalName: string) {
            const clean = (originalName.trim() || 'reference').slice(0, 31);
            if (!workbook.getWorksheet(clean)) return clean;
            for (let index = 1; index < 1000; index += 1) {
              const suffix = `_${index}`;
              const candidate = `ref_${clean}`.slice(0, 31 - suffix.length) + suffix;
              if (!workbook.getWorksheet(candidate)) return candidate;
            }
            throw new Error(`Nama worksheet referensi tidak dapat dibuat unik: ${originalName}`);
          }

          function addPersistedReferenceSheets(workbook: ExcelJS.Workbook, rows: SourceRow[]) {
            const grouped = new Map<string, SourceRow[]>();
            for (const row of rows) grouped.set(row.originalSheetName, [...(grouped.get(row.originalSheetName) ?? []), row]);
            for (const [originalName, sourceRows] of grouped) {
              const sheet = workbook.addWorksheet(uniqueReferenceSheetName(workbook, originalName));
              writeRawMatrix(sheet, sourceRows);
            }
          }
          """
          helpers = '\n'.join(line[10:] if line.startswith('          ') else line for line in helpers.splitlines())
          text = text[:insert_at] + helpers + text[insert_at:]
          old_2000 = "    const rincian = workbook.addWorksheet('rincian biaya'); writeRawMatrix(rincian, requireAuditRows(allRows, 'AUDIT_RINCIAN', 'rincian biaya'));\n    addSourceSheet(workbook, 'cc prod', rowsByCode(allRows, 'CC_PROD'));"
          if old_2000 not in text: raise SystemExit('Company 2000 export marker missing')
          text = text.replace(old_2000, "    const rincian = workbook.addWorksheet('rincian biaya'); writeRawMatrix(rincian, requireAuditRows(allRows, 'AUDIT_RINCIAN', 'rincian biaya'));\n    addSourceSheet(workbook, 'tb', rowsByCode(allRows, 'TB'), true);\n    addSourceSheet(workbook, 'cc prod', rowsByCode(allRows, 'CC_PROD'));", 1)
          formula_marker = "  writeFormulaAudit(workbook, run);"
          if text.count(formula_marker) != 1: raise SystemExit('formula audit marker not unique')
          text = text.replace(formula_marker, "  addPersistedReferenceSheets(workbook, rowsByCode(allRows, 'AUDIT_REFERENCE'));\n  writeFormulaAudit(workbook, run);", 1)
          write(path, text)

          # Direct API calls may not reconcile/finalize a stale run.
          path = 'lib/cost-structure/finalization/policy.ts'
          text = read(path)
          old = "  run: null | { id: number; status: string; isActive: boolean; uploadIsActiveVersion: boolean };"
          if old not in text: raise SystemExit('policy run type missing')
          text = text.replace(old, "  run: null | { id: number; status: string; isActive: boolean; uploadIsActiveVersion: boolean; requiresRecalculation?: boolean };", 1)
          guard = "  if (!snapshot.run.uploadIsActiveVersion) throw new FinalizationError('Active calculation run masih terikat ke upload versi lama. Proses upload aktif harus dihitung terlebih dahulu.');"
          if guard not in text: raise SystemExit('policy upload guard missing')
          text = text.replace(guard, guard + "\n  if (snapshot.run.requiresRecalculation) throw new FinalizationError('Active calculation run stale; jalankan Recalculate sebelum reconciliation/finalization.');", 1)
          write(path, text)

          path = 'lib/cost-structure/finalization/service.ts'
          text = read(path)
          if "getCurrentEngine1RuleSetVersion" not in text:
              text = text.replace("import { prisma } from '@/lib/prisma';\n", "import { prisma } from '@/lib/prisma';\nimport { getCurrentEngine1RuleSetVersion } from '@/lib/cost-structure/calculations/rule-set';\n", 1)
          old_select = "activeCalculationRun: { select: { id: true, status: true, isActive: true, uploadId: true, upload: { select: { isActiveVersion: true } } } },"
          if old_select not in text: raise SystemExit('finalization active run select missing')
          text = text.replace(old_select, "activeCalculationRun: { select: { id: true, status: true, isActive: true, uploadId: true, ruleSetVersion: true, completedAt: true, upload: { select: { isActiveVersion: true } } } },", 1)
          return_marker = "  return {\n    companyCode: period.company.companyCode,"
          if return_marker not in text: raise SystemExit('finalization return marker missing')
          prelude = """  const currentRuleSetVersion = getCurrentEngine1RuleSetVersion(period.company.companyCode);
            const runRequiresRecalculation = Boolean(period.activeCalculationRun && (
              period.activeCalculationRun.ruleSetVersion !== currentRuleSetVersion ||
              (period.reopenedAt && (!period.activeCalculationRun.completedAt || period.activeCalculationRun.completedAt < period.reopenedAt))
            ));
            return {
              companyCode: period.company.companyCode,"""
          prelude = '\n'.join(line[10:] if line.startswith('          ') else line for line in prelude.splitlines())
          text = text.replace(return_marker, prelude, 1)
          projection = "      uploadIsActiveVersion: period.activeCalculationRun.upload.isActiveVersion,\n    } : null,"
          if projection not in text: raise SystemExit('finalization run projection missing')
          text = text.replace(projection, "      uploadIsActiveVersion: period.activeCalculationRun.upload.isActiveVersion,\n      requiresRecalculation: runRequiresRecalculation,\n    } : null,", 1)
          write(path, text)

          # Reference refresh remains admin-only. Recalculate uses normal prepare permission.
          path = 'components/cost-structure/process/process-workflow.tsx'
          text = read(path)
          if "getCurrentUserRole, isAdmin" not in text:
              text = text.replace("import { useCallback, useEffect, useRef, useState } from 'react';\n", "import { useCallback, useEffect, useRef, useState } from 'react';\nimport { getCurrentUserRole, isAdmin } from '@/app/utils/rolePermissions';\n", 1)
          if "const [admin, setAdmin]" not in text:
              text = text.replace("  const [submitting, setSubmitting] = useState(false);\n", "  const [submitting, setSubmitting] = useState(false);\n  const [admin, setAdmin] = useState(false);\n", 1)
          role_effect = """  useEffect(() => {
            const role = getCurrentUserRole();
            // eslint-disable-next-line react-hooks/set-state-in-effect
            setAdmin(role !== null && isAdmin(role));
          }, []);
          """
          role_effect = '\n'.join(line[10:] if line.startswith('          ') else line for line in role_effect.splitlines()) + '\n'
          if "setAdmin(role !== null && isAdmin(role));" not in text:
              marker = "  useEffect(() => {\n    if (!process || requestInFlight.current) return;"
              if marker not in text: raise SystemExit('workflow main effect marker missing')
              text = text.replace(marker, role_effect + marker, 1)
          if "  const auditNeedsPreparation = auditStage?.status === 'NOT_APPLICABLE';" in text:
              text = text.replace("  const auditNeedsPreparation = auditStage?.status === 'NOT_APPLICABLE';", "  const auditNeedsPreparation = admin;", 1)
          text = text.replace('Audit/reference historical untuk export belum lengkap', 'Referensi workbook untuk export')
          text = text.replace('Snapshot referensi dapat di-refresh dari workbook authoritative tanpa mengubah Engine 1 atau calculation run.', 'Refresh membaca ulang worksheet audit/referensi dari workbook authoritative tanpa mengubah Engine 1 atau calculation run.')
          write(path, text)

          # New regression contract.
          test_text = """import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import test from 'node:test';
          import { deriveProcessStatus, type ProcessingSnapshot } from './processing/state-machine';

          const base = (overrides: Partial<ProcessingSnapshot> = {}): ProcessingSnapshot => ({
            uploadId: 15,
            periodId: 15,
            uploadActive: true,
            uploadStatus: 'VALIDATED',
            periodStatus: 'COST_STRUCTURE_RECONCILED',
            validationBlockers: [],
            reconciliationReady: true,
            reconciliationBlockers: [],
            auditReady: true,
            auditMissing: [],
            calculation: { status: 'SUCCESS', belongsToUpload: true },
            postCheckBlockers: [],
            ...overrides,
          });

          test('stale successful run becomes explicit recalculation stage and cannot finalize', () => {
            const status = deriveProcessStatus(base({ calculation: {
              status: 'SUCCESS', belongsToUpload: true, requiresRecalculation: true,
              runRuleSetVersion: 'ENGINE1_7000_V1', currentRuleSetVersion: 'ENGINE1_7000_V2',
            } }));
            assert.equal(status.currentStage, 'CALCULATION');
            assert.equal(status.requiresRecalculation, true);
            assert.equal(status.canAdvance, true);
            assert.equal(status.readyForFinalization, false);
          });

          test('fresh successful run remains ready after post-check', () => {
            const status = deriveProcessStatus(base());
            assert.equal(status.overallStatus, 'READY');
            assert.equal(status.readyForFinalization, true);
          });

          test('recalculate and full workbook reference traceability contracts are wired', () => {
            const company7000 = readFileSync('lib/cost-structure/calculations/company-7000.ts', 'utf8');
            const runService = readFileSync('lib/cost-structure/calculations/run-service.ts', 'utf8');
            const parser = readFileSync('lib/cost-structure/parsers/index.ts', 'utf8');
            const exporter = readFileSync('lib/cost-structure/export/service.ts', 'utf8');
            const finalization = readFileSync('lib/cost-structure/finalization/policy.ts', 'utf8');
            assert.match(company7000, /ENGINE1_7000_V2/);
            assert.equal((runService.match(/COST_STRUCTURE_RECONCILED/g) ?? []).length >= 2, true);
            assert.match(parser, /AUDIT_REFERENCE/);
            assert.match(exporter, /addPersistedReferenceSheets/);
            assert.match(exporter, /addSourceSheet\(workbook, 'tb', rowsByCode\(allRows, 'TB'\), true\)/);
            assert.doesNotMatch(exporter, /if \(columnKeys\.length\)/);
            assert.match(finalization, /requiresRecalculation/);
          });
          """
          test_text = '\n'.join(line[10:] if line.startswith('          ') else line for line in test_text.splitlines()) + '\n'
          write('lib/cost-structure/recalculate-export-traceability.test.ts', test_text)

          Path('.github/workflows/finalize-recalc-export-fix.yml').unlink()
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Cost structure tests
        run: npm test
      - name: Lint changed production files
        run: npx eslint components/cost-structure/process/presentation.ts components/cost-structure/process/process-workflow.tsx components/cost-structure/process/types.ts lib/cost-structure/calculations/company-7000.ts lib/cost-structure/calculations/rule-set.ts lib/cost-structure/calculations/run-service.ts lib/cost-structure/processing/automatic-calculation.ts lib/cost-structure/processing/service.ts lib/cost-structure/processing/state-machine.ts lib/cost-structure/parsers/index.ts lib/cost-structure/parsers/types.ts lib/cost-structure/export/service.ts lib/cost-structure/finalization/policy.ts lib/cost-structure/finalization/service.ts lib/cost-structure/recalculate-export-traceability.test.ts
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Commit tested fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(cost): recalculate stale runs and export full source lineage"
          git push origin HEAD:fix/recalculate-export-traceability
