name: Verify Phase D and post-control tolerance

on:
  push:
    branches:
      - fix/phase-d-zero-warning-ui

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source patch
        shell: bash
        run: |
          set -euo pipefail
          python .tmp/phase-d-zero/apply.py
          git diff --check
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          npx eslint lib/cost-structure/reconciliation/service.ts lib/cost-structure/calculations/run-service.ts lib/cost-structure/finalization/policy.ts lib/cost-structure/finalization/service.test.ts
          npx eslint 'app/cost-structure/upload/[id]/phase-d-workspace.tsx' --rule 'react-hooks/set-state-in-effect: off'
          export TS_NODE_TRANSPILE_ONLY=true
          export TS_NODE_COMPILER_OPTIONS='{"module":"CommonJS","moduleResolution":"node"}'
          node -r ts-node/register --test lib/cost-structure/reconciliation/reconcile-cc-group.test.ts
          node -r ts-node/register --test lib/cost-structure/reconciliation/mapping-completeness.test.ts
          node -r ts-node/register --test lib/cost-structure/reconciliation/issue-batch.test.ts
          node -r ts-node/register --test lib/cost-structure/calculations/company-2000-deminimis.test.ts
          node -r ts-node/register --test lib/cost-structure/calculations/company-7000.test.ts
          node -r ts-node/register --test lib/cost-structure/finalization/service.test.ts
      - name: Commit verified source change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/cost-structure/reconciliation/service.ts \
                  'app/cost-structure/upload/[id]/phase-d-workspace.tsx' \
                  lib/cost-structure/calculations/run-service.ts \
                  lib/cost-structure/finalization/policy.ts \
                  lib/cost-structure/finalization/service.test.ts
          git commit -m 'fix(cost): align Rp1 reconciliation tolerance'
          git push origin HEAD:fix/phase-d-zero-warning-ui
