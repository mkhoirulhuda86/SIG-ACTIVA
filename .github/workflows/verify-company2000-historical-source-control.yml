name: Verify Company 2000 historical source control

on:
  push:
    branches:
      - fix/company2000-historical-source-control

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source patch
        shell: bash
        run: |
          set -euo pipefail
          python .tmp/company2000-historical-source/apply.py
          git diff --check
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          npx eslint lib/cost-structure/calculations/company-2000-si-adapter.ts lib/cost-structure/reconciliation/company-2000-source-control-policy.ts lib/cost-structure/reconciliation/company-2000-source-control-policy.test.ts lib/cost-structure/reconciliation/issue-batch.ts lib/cost-structure/reconciliation/service.ts lib/cost-structure/processing/revalidate-upload.ts lib/cost-structure/processing/service.ts
          export TS_NODE_TRANSPILE_ONLY=true
          export TS_NODE_COMPILER_OPTIONS='{"module":"CommonJS","moduleResolution":"node"}'
          node -r ts-node/register --test lib/cost-structure/reconciliation/company-2000-source-control-policy.test.ts
          node -r ts-node/register --test lib/cost-structure/calculations/company-2000-si-adapter.test.ts
          node -r ts-node/register --test lib/cost-structure/reconciliation/reconcile-cc-group.test.ts
          node -r ts-node/register --test lib/cost-structure/processing/state-machine.test.ts
          node -r ts-node/register --test --test-name-pattern='prefers authoritative Cost Elements|skips a repeated SAP header' lib/cost-structure/parsers/workbook.test.ts
      - name: Commit verified source change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/cost-structure/calculations/company-2000-si-adapter.ts lib/cost-structure/reconciliation/company-2000-source-control-policy.ts lib/cost-structure/reconciliation/company-2000-source-control-policy.test.ts lib/cost-structure/reconciliation/issue-batch.ts lib/cost-structure/reconciliation/service.ts lib/cost-structure/processing/revalidate-upload.ts lib/cost-structure/processing/service.ts
          git commit -m 'fix(cost): support historical Company 2000 controls'
          git push origin HEAD:fix/company2000-historical-source-control
