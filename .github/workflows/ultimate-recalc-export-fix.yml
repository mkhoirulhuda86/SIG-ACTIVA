name: Resolve final recalc export regressions

on:
  push:
    branches:
      - fix/recalculate-export-traceability

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply feature patch and remaining regressions
        shell: bash
        run: |
          python <<'RUNNER'
          from pathlib import Path
          import textwrap

          # Reuse the already-reviewed feature patch, then apply precise regression fixes.
          source = Path('.github/workflows/final-recalc-export-green.yml').read_text()
          marker = "python <<'PY'\n"
          script = source.split(marker, 1)[1].split("\n          PY", 1)[0]
          exec(compile(textwrap.dedent(script), '<feature-patch>', 'exec'), {})

          def read(path): return Path(path).read_text()
          def write(path, text): Path(path).write_text(text)
          def once(path, old, new):
              text = read(path)
              if old not in text:
                  raise SystemExit(f'missing pattern in {path}: {old[:140]!r}')
              write(path, text.replace(old, new, 1))

          # Preserve absolute Excel source row numbers when a worksheet used-range starts below row 1.
          p = 'lib/cost-structure/parsers/workbook.ts'
          t = read(p)
          t = t.replace("type MatchedSheet = { name: string; rows: SheetMatrix };", "type MatchedSheet = { name: string; rows: SheetMatrix; startRow: number };", 1)
          sheet_fn = """function sheetMatrix(workbook: XLSX.WorkBook, sheetName: string): SheetMatrix {
            const sheet = workbook.Sheets[sheetName];
            if (!sheet || !sheet['!ref']) return [];
            return XLSX.utils.sheet_to_json<unknown[]>(sheet, {
              header: 1,
              raw: true,
              defval: null,
              blankrows: true,
            }) as SheetMatrix;
          }
          """
          sheet_fn = '\n'.join(line[10:] if line.startswith('          ') else line for line in sheet_fn.splitlines()) + '\n'
          replacement = sheet_fn + """
          function sheetStartRow(workbook: XLSX.WorkBook, sheetName: string): number {
            const ref = workbook.Sheets[sheetName]?.['!ref'];
            return ref ? XLSX.utils.decode_range(ref).s.r + 1 : 1;
          }
          """
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines()) + '\n'
          if sheet_fn not in t: raise SystemExit('sheetMatrix block missing')
          t = t.replace(sheet_fn, replacement, 1)
          # Both known-source and reference second-pass sheet objects need absolute-row metadata.
          t = t.replace("const sheet = { name: sheetName, rows: sheetMatrix(workbook, sheetName) };", "const sheet = { name: sheetName, rows: sheetMatrix(workbook, sheetName), startRow: sheetStartRow(workbook, sheetName) };")
          # Raw rows and locked clinker rule use absolute worksheet row numbers.
          t = t.replace("  sheet.rows.forEach((values, index) => {\n    if (values.every((value) => text(value) === null)) return;", "  sheet.rows.forEach((values, index) => {\n    const sourceRowNumber = sheet.startRow + index;\n    if (values.every((value) => text(value) === null)) return;", 1)
          t = t.replace("if (code === 'CLINKER_PURCHASE' && index + 1 >= 63 && index + 1 <= 69", "if (code === 'CLINKER_PURCHASE' && sourceRowNumber >= 63 && sourceRowNumber <= 69", 1)
          t = t.replace("      sourceRowNumber: index + 1,", "      sourceRowNumber,", 1)
          # Normalized CC/TB source rows also retain authoritative absolute row numbers.
          t = t.replace("      sourceRowNumber: rowIndex + 1,", "      sourceRowNumber: sheet.startRow + rowIndex,", 1)
          t = t.replace("message: `COA kosong pada ${sheet.name} baris ${rowIndex + 1}.`", "message: `COA kosong pada ${sheet.name} baris ${sheet.startRow + rowIndex}.`", 1)
          write(p, t)

          # Admin-only reference refresh: do not expose maintenance action to normal preparers.
          p = 'components/cost-structure/process/process-workflow.tsx'
          lines = read(p).splitlines()
          fixed = []
          for line in lines:
              if line.strip() == 'const auditNeedsPreparation = admin;':
                  continue
              if 'onClick={() => void hydrateAudit()}' in line and 'auditNeedsPreparation' in line:
                  fixed.append('    {admin && <div className="flex min-w-0 flex-wrap items-center justify-between gap-3 rounded-lg border bg-muted/20 p-3 text-sm"><div className="min-w-0"><p className="font-medium">Referensi workbook untuk export</p><p className="mt-1 break-words text-xs text-muted-foreground">Refresh membaca ulang hanya AUDIT_* dan sheet referensi dari workbook authoritative yang hash-nya terverifikasi; Engine 1 dan calculation run tidak diubah.</p></div><button type="button" disabled={submitting} onClick={() => void hydrateAudit()} className="rounded-md border border-primary px-3 py-2 font-medium text-primary disabled:opacity-50">{submitting ? \'Menyiapkan…\' : \'Refresh referensi export\'}</button></div>}')
              else:
                  fixed.append(line)
          write(p, '\n'.join(fixed) + '\n')

          # Update stale structural tests to the current navigation and process contracts.
          p = 'lib/cost-structure/sidebar-navigation.test.ts'
          t = read(p).replace("  '/cost-structure/periods',\n", '', 1)
          write(p, t)

          p = 'lib/cost-structure/ui/auto-process.test.ts'
          t = read(p)
          t = t.replace("  assert.match(api, /if \\(process\\)[\\s\\S]*retryable/);", "  assert.match(api, /if \\(process\\)[\\s\\S]*process,[\\s\\S]*false/);", 1)
          old = """  assert.match(runner, /isAdmin\\(role\\)/);
            assert.match(runner, /stage\\.key === 'AUDIT_READINESS'/);
            assert.match(runner, /stage\\?\\.status === 'NOT_APPLICABLE'/);
            assert.match(runner, /Siapkan audit export/);
            assert.match(runner, /JSON\\.stringify\\(\\{ expectedUploadId: uploadId \\}\\)/);
          """
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines()) + '\n'
          new = """  assert.match(runner, /isAdmin\\(role\\)/);
            assert.match(runner, /\\{admin && <div/);
            assert.match(runner, /Refresh referensi export/);
            assert.match(runner, /JSON\\.stringify\\(\\{ expectedUploadId: uploadId \\}\\)/);
          """
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines()) + '\n'
          if old not in t: raise SystemExit('auto-process historical audit test block missing')
          t = t.replace(old, new, 1)
          write(p, t)

          # The feature patch removes these; remove this runner too before final commit.
          for wf in [
            '.github/workflows/final-recalc-export-green.yml',
            '.github/workflows/finalize-recalc-export-fix.yml',
            '.github/workflows/retry-finalize-recalc-export-fix.yml',
            '.github/workflows/ultimate-recalc-export-fix.yml',
          ]:
              Path(wf).unlink(missing_ok=True)
          RUNNER
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Full cost structure test suite
        run: npm test
      - name: Lint changed files
        run: npx eslint components/cost-structure/process/presentation.ts components/cost-structure/process/process-workflow.tsx components/cost-structure/process/types.ts lib/cost-structure/calculations/company-7000.ts lib/cost-structure/calculations/rule-set.ts lib/cost-structure/calculations/run-service.ts lib/cost-structure/processing/automatic-calculation.ts lib/cost-structure/processing/service.ts lib/cost-structure/processing/state-machine.ts lib/cost-structure/parsers/workbook.ts lib/cost-structure/parsers/types.ts lib/cost-structure/export/service.ts lib/cost-structure/finalization/policy.ts lib/cost-structure/finalization/service.ts lib/cost-structure/recalculate-export-traceability.test.ts lib/cost-structure/calculations/company-2000-deminimis.test.ts lib/cost-structure/export/style-blueprint/types.ts lib/cost-structure/export/style-blueprint/company-2000-exact.ts lib/cost-structure/sidebar-navigation.test.ts lib/cost-structure/processing/state-machine.test.ts lib/cost-structure/ui/auto-process.test.ts
      - name: TypeScript check
        run: npx tsc --noEmit --pretty false
      - name: Commit green fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(cost): recalculate stale runs and export full source lineage"
          git push origin HEAD:fix/recalculate-export-traceability
