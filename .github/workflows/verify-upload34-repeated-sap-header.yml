name: Verify Upload 34 repeated SAP header fix

on:
  push:
    branches:
      - fix/upload34-repeated-sap-header

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: |
          set -euo pipefail
          python .tmp/upload34-repeated-header/apply.py
          git diff --check
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify
        run: |
          set -euo pipefail
          npx eslint lib/cost-structure/parsers/workbook.ts lib/cost-structure/parsers/workbook.test.ts
          export TS_NODE_TRANSPILE_ONLY=true
          export TS_NODE_COMPILER_OPTIONS='{"module":"CommonJS","moduleResolution":"node"}'
          node -r ts-node/register --test --test-name-pattern='historical repeated SAP header|repeated SAP header and prefers authoritative' lib/cost-structure/parsers/workbook.test.ts
      - name: Commit verified source change
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/cost-structure/parsers/workbook.ts lib/cost-structure/parsers/workbook.test.ts
          git commit -m 'fix(cost): skip truncated repeated SAP headers'
          git push origin HEAD:fix/upload34-repeated-sap-header
