name: Patch Company 7000 OA authoritative

on:
  push:
    branches:
      - fix/manual-mapping-commentary-hardening
    paths:
      - scripts/patch-company7000-oa-authoritative.py
      - .github/workflows/patch-company7000-oa-authoritative.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/manual-mapping-commentary-hardening
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply OA patch
        run: python3 scripts/patch-company7000-oa-authoritative.py

      - name: Fix deterministic adapter test COA ids
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/cost-structure/calculations/company-7000-source-adapter.test.ts')
          text = path.read_text()
          old = "coaId: coaId === undefined ? (coaCode && /^\\d{8}$/.test(coaCode) ? Number(coaCode.slice(-5)) + 100 : null) : coaId,"
          new = "coaId: coaId === undefined ? (coaCode && /^\\d{8}$/.test(coaCode) ? Number(coaCode) : null) : coaId,"
          if old not in text:
              raise SystemExit('adapter fixture coaId anchor not found')
          path.write_text(text.replace(old, new))
          PY

      - name: Install dependencies
        run: npm install

      - name: Targeted Company 7000 tests
        env:
          TS_NODE_COMPILER_OPTIONS: '{"module":"CommonJS","moduleResolution":"node"}'
        run: node -r ts-node/register --test lib/cost-structure/calculations/company-7000-source-adapter.test.ts lib/cost-structure/calculations/company-7000.test.ts

      - name: ESLint changed production and tests
        run: npx eslint lib/cost-structure/calculations/company-7000-source-adapter.ts lib/cost-structure/calculations/company-7000.ts lib/cost-structure/calculations/company-7000-source-adapter.test.ts lib/cost-structure/calculations/company-7000.test.ts

      - name: Build compile/typecheck smoke
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: |
          set +e
          npm run build 2>&1 | tee /tmp/build.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          grep -q "Compiled successfully" /tmp/build.log
          grep -q "Running TypeScript" /tmp/build.log
          grep -q "Can't reach database server at 127.0.0.1:5432" /tmp/build.log
          echo "Accepted expected CI-only prerender failure after successful compile/typecheck because no live database is available."

      - name: Verify intended diff
        run: |
          git diff --check
          git status --short
          test -n "$(git status --short)"

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/cost-structure/calculations/company-7000-source-adapter.ts \
                  lib/cost-structure/calculations/company-7000.ts \
                  lib/cost-structure/calculations/company-7000-source-adapter.test.ts \
                  lib/cost-structure/calculations/company-7000.test.ts
          git commit -m "fix(cost): use authoritative Company 7000 OA"
          git push origin HEAD:fix/manual-mapping-commentary-hardening
